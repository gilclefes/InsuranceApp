name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore InsuranceApp.sln

      - name: Build
        run: dotnet build InsuranceApp.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test InsuranceApp.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'
